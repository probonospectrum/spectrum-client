<label class="field">
  <span class="field__label">{{ label }}</span>
  <input
    class="field__control"
    [type]="type"
    [value]="value"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [attr.autocomplete]="autocomplete || null"
    [class.field__control--invalid]="error"
    (input)="updateValue($any($event.target).value)"
    (blur)="markAsTouched()"
  />
  <span
    class="field__error"
    [class.field__error--visible]="error"
    aria-live="polite"
  >{{ error }}</span>
</label>
