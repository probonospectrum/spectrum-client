@if (!submitted) {
  <div class="report-backdrop" role="presentation" (click)="!submitting && close.emit()">
    <section
      class="report-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="report-title"
      (click)="$event.stopPropagation()"
    >
      <header class="report-modal__header">
        <div class="report-modal__heading">
          <h2 id="report-title">{{ (title) | translate }}</h2>
          <p class="report-modal__hint">{{ 'Selecione o motivo da denúncia.' | translate }}</p>
        </div>
        <button class="report-modal__close" type="button" [attr.aria-label]="'Fechar' | translate" (click)="close.emit()">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </header>

      <div class="report-options" role="radiogroup" [attr.aria-label]="'Motivo da denuncia' | translate">
        @for (reason of reasons; track reason) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="selectedReason === reason"
            [class.report-options__item--active]="selectedReason === reason"
            class="report-options__item"
            [disabled]="submitting" (click)="select(reason)"
          >
            <span class="report-options__label">{{ reason | translate }}</span>
            <span class="report-options__radio" aria-hidden="true"></span>
          </button>
        }
      </div>

      @if (submissionError) { <p role="alert">{{ (submissionError) | translate }}</p> }
      <button class="report-modal__submit" type="button" [disabled]="submitting" (click)="onConfirm()">{{ (submitting ? 'Enviando...' : 'Denunciar') | translate }}</button>
    </section>
  </div>
} @else {
  <app-alert-popup
    type="success"
    [title]="'Enviado' | translate"
    [message]="'Sua denúncia foi registrada com sucesso. Nossa equipe irá analisar seu relato e iremos retornar o mais breve possível. Agradecemos sua confiança e colaboração para manter nossa comunidade segura.' | translate"
    [actionLabel]="'Feito' | translate"
    (dismissed)="onDone()"
  />
}
