<article class="notification" [class.notification--unread]="!notification.read">
  <div class="notification__badge" [attr.data-type]="notification.type" aria-hidden="true">
    {{ typeLabel.charAt(0) }}
  </div>

  <div class="notification__body">
    <div class="notification__meta">
      <span>{{ typeLabel }}</span>
      <time>{{ notification.dateLabel }}</time>
    </div>
    <h2>{{ notification.title }}</h2>
    <p>{{ notification.description }}</p>

    @if (notification.actionLabel) {
      <button class="notification__action" type="button">{{ notification.actionLabel }}</button>
    }
  </div>

  <div class="notification__controls">
    @if (!notification.read) {
      <button type="button" (click)="markRead.emit(notification.id)">Marcar lida</button>
    }
    <button type="button" aria-label="Remover notificacao" (click)="remove.emit(notification.id)">
      Remover
    </button>
  </div>
</article>
