<article class="notification" [class.notification--unread]="!notification.read" (click)="onOpen()">
  @if (notification.actorAvatarUrl) {
    <img class="notification__avatar" [src]="notification.actorAvatarUrl" [alt]="displayName" />
  } @else {
    <div class="notification__avatar notification__avatar--fallback" aria-hidden="true">
      {{ initials }}
    </div>
  }

  <div class="notification__body">
    <p class="notification__headline">
      <strong>{{ displayName }}</strong>
      @if (notification.actorHandle) {
        <span class="notification__handle">&#64;{{ notification.actorHandle }}</span>
      }
    </p>
    <p class="notification__description">{{ notification.description }}</p>
  </div>

  <button
    class="notification__remove"
    type="button"
    aria-label="Remover notificacao"
    (click)="onRemove($event)"
  >
    &times;
  </button>
</article>
