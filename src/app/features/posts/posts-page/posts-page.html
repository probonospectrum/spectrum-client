<app-social-shell
  [user]="user"
  [suggestions]="suggestions"
  title="Publicacoes"
  [showContentHeader]="false"
  (logout)="logout()"
>
  <a class="posts-primary-action" routerLink="/publicacoes/nova" social-actions>Nova publicacao</a>

  @for (post of posts; track post.id) {
    <app-post-card [post]="post" (report)="openReport($event)" />
  } @empty {
    <section class="posts-empty">
      <h2>Nenhuma publicacao por aqui</h2>
      <p>Crie a primeira publicacao para movimentar sua comunidade.</p>
      <a routerLink="/publicacoes/nova">Criar publicacao</a>
    </section>
  }
</app-social-shell>

@if (reportPost) {
  <app-report-modal
    title="O que está sendo reportado?"
    (close)="reportPost = null"
    (confirm)="confirmReport()"
  />
}
