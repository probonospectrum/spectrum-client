<app-social-shell
  #socialShell
  [user]="user"
  [suggestions]="suggestions"
  title="Publicacoes"
  [showContentHeader]="false"
  (logout)="logout()"
  (postCreated)="onPostCreated()"
  (postUpdated)="onPostUpdated()"
>


  <section
    class="post-composer"
    role="button"
    tabindex="0"
    (click)="socialShell.openCreatePost()"
    (keydown.enter)="socialShell.openCreatePost()"
    (keydown.space)="socialShell.openCreatePost()"
  >
    <div class="post-composer__avatar">
      {{ userInitial }}
    </div>

    <div class="post-composer__body">
      <div class="post-composer__field">
        <span>O que você está pensando?</span>

        <button
          type="button"
          class="post-composer__publish"
          (click)="$event.stopPropagation(); socialShell.openCreatePost()"
        >
          Publicar
        </button>
      </div>

    </div>
  </section>

  @if (feedLoading()) {
    <section class="posts-loading">
      <app-loading-indicator label="Carregando publicacoes" />
    </section>
  } @else {
    @for (post of posts; track post.id) {
      <app-post-card
        [post]="post"
        [currentUser]="user"
        (report)="openReport($event)"
        (edit)="socialShell.openEditPost($event)"
        (remove)="deletePost($event)"
        (repost)="toggleRepost($event)"
        (hideAuthor)="hideAuthor($event)"
        (notInterested)="hidePost($event)"
        (aiSpam)="openReport($event, 'Parece spam de IA')"
        (copyLink)="copyPostLink($event)"
      />
    } @empty {
      <section class="posts-empty">
        <h2>Nenhuma publicacao por aqui</h2>
        <p>Crie a primeira publicacao para movimentar sua comunidade.</p>
        <button type="button" (click)="socialShell.openCreatePost()">Criar publicacao</button>
      </section>
    }
  }

</app-social-shell>

@if (reportPost) {
  <app-report-modal
    title="O que está sendo reportado?"
    (close)="reportPost = null"
    (confirm)="confirmReport()"
  />
}

@if (feedAlert(); as currentFeedAlert) {
  <app-alert-popup
    [type]="currentFeedAlert.type"
    [title]="currentFeedAlert.title"
    [message]="currentFeedAlert.message"
    actionLabel="Ok"
    (dismissed)="feedAlert.set(null)"
  />
}
