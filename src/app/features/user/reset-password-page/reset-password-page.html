<app-auth-shell>
  <form
    class="auth-form"
    [formGroup]="resetPasswordForm"
    (ngSubmit)="resetPassword()"
  >
    <h1>{{ 'Redefinir senha' | translate }}</h1>

    <p class="auth-description">
      {{ 'Digite sua nova senha para recuperar o acesso à sua conta.' | translate }}
    </p>

    <app-input
      [label]="'Nova senha' | translate"
      [placeholder]="'Digite sua nova senha' | translate"
      type="password"
      autocomplete="new-password"
      formControlName="password"
      [error]="(fieldError('password')) | translate"
    />

    <app-input
      [label]="'Confirmar senha' | translate"
      [placeholder]="'Digite sua nova senha novamente' | translate"
      type="password"
      autocomplete="new-password"
      formControlName="confirmPassword"
      [error]="(fieldError('confirmPassword')) | translate"
    />

    <app-button type="submit">
      {{ 'Redefinir senha' | translate }}
    </app-button>

    <button
      class="auth-link"
      type="button"
      (click)="goToLogin()"
    >
      {{ 'Voltar para o login' | translate }}
    </button>
  </form>
</app-auth-shell>
