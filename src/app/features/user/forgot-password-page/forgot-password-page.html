<app-auth-shell>
  <form
    class="auth-form"
    [formGroup]="forgotPasswordForm"
    (ngSubmit)="sendResetLink()"
  >
    <h1>Recuperar senha</h1>

    <p class="auth-description">
      Digite o email associado à sua conta e enviaremos um link para você redefinir sua senha.
    </p>

    <app-input
      label="Email"
      placeholder="Seu email"
      type="email"
      autocomplete="email"
      formControlName="email"
      [error]="fieldError()"
    />

    <app-button type="submit">
      Enviar link
    </app-button>

    <button
      class="auth-link"
      type="button"
      (click)="goToLogin()"
    >
      Voltar para o login
    </button>
  </form>
</app-auth-shell>
