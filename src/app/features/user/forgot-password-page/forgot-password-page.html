<app-auth-shell>
  <form
    class="auth-form"
    [formGroup]="forgotPasswordForm"
    (ngSubmit)="sendResetLink()"
  >
    <h1>{{ 'Recuperar senha' | translate }}</h1>

    <p class="auth-description">
      {{ 'Digite o email associado à sua conta e enviaremos um link para você redefinir sua senha.' | translate }}
    </p>

    <app-input
      [label]="'Email' | translate"
      [placeholder]="'Seu email' | translate"
      type="email"
      autocomplete="email"
      formControlName="email"
      [error]="(fieldError()) | translate"
    />

    <app-button type="submit" routerLink="/reset-password"> 
      {{ 'Enviar link' | translate }}
    </app-button>

    <button
      class="auth-link"
      type="button"
      (click)="goToLogin()"
    >
      {{ 'Voltar para o login' | translate }}
    </button>
  </form>
</app-auth-shell>
