<app-auth-shell [compact]="isRegisterMode">

  @if (!isRegisterMode) {

    <form
      class="auth-form auth-form--login"
      [formGroup]="loginForm"
      (ngSubmit)="submitLogin()"
    >

      <app-input
        label="Nome de usuario ou email"
        placeholder="Seu nome de usuario ou email"
        autocomplete="username"
        formControlName="identifier"
        [error]="fieldError('login', 'identifier')"
      />

      <app-input
        label="Senha"
        placeholder="Sua senha"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [error]="fieldError('login', 'password')"
      />

      <button class="auth-link" type="button" routerLink="/forgot-password"> Esqueceu sua senha? Clique aqui para redefini-la</button>
      <button class="auth-link" type="button" (click)="goToRegister()">
        Ainda nao possui cadastro? Cadastre-se aqui
      </button>

      <app-button
        type="submit"
        [disabled]="isSubmitting()"
        [loading]="isSubmitting()"
        loadingLabel="Entrando"
      >
        Entrar
      </app-button>
      @if (isGoogleLoginAvailable) {
        <button class="auth-link auth-link--google" type="button" (click)="loginWithGoogle()">
          Entrar com o Google
        </button>
      }
    </form>

  } @else {

    <app-auth-mode-toggle [registerStep]="registerStep()" />

    <form
      class="auth-form"
      [formGroup]="registerForm"
      (ngSubmit)="submitRegister()"
    >

      @if (registerStep() === 1) {

        <app-input
          label="Nome de usuario"
          placeholder="Seu nome de usuario"
          autocomplete="username"
          formControlName="nickname"
          [error]="fieldError('register', 'nickname')"
        />

        <app-input
          label="Email"
          placeholder="Seu email"
          autocomplete="email"
          formControlName="email"
          [error]="fieldError('register', 'email')"
        />

        <app-input
          label="Data de nascimento"
          placeholder="DD/MM/YYYY"
          type="date"
          autocomplete="bday"
          formControlName="birthDate"
          [error]="fieldError('register', 'birthDate')"
        />

        <app-input
          label="Senha"
          placeholder="Sua senha"
          type="password"
          autocomplete="new-password"
          formControlName="password"
          [error]="fieldError('register', 'password')"
        />

        <app-button
          type="button"
          (click)="goToNextRegisterStep()"
        >
          Proximo
        </app-button>

      } @else {

        <div class="auth-avatar" aria-hidden="true">
          <span></span>
        </div>

        <app-input
          label="Nome proprio"
          placeholder="Seu nome"
          autocomplete="name"
          formControlName="name"
          [error]="fieldError('register', 'name')"
        />

        <app-select
          label="Estado"
          placeholder="Selecione seu estado"
          formControlName="stateId"
          [loading]="isLoadingStates()"
          [options]="stateOptions"
          [error]="fieldError('register', 'stateId')"
        />

        <app-select
          label="Municipio"
          placeholder="Selecione seu municipio"
          formControlName="cityUser"
          [loading]="isLoadingCities()"
          [isDisabled]="isCitySelectDisabled"
          [options]="cityOptions"
          [error]="fieldError('register', 'cityUser')"
        />

        <div class="auth-actions">

          <button
            class="auth-link"
            type="button"
            (click)="goToPreviousRegisterStep()"
          >
            Voltar
          </button>

          <app-button
            type="submit"
            [disabled]="isSubmitting()"
            [loading]="isSubmitting()"
            loadingLabel="Cadastrando"
          >
            Cadastrar
          </app-button>

        </div>

      }

    </form>

    <button
      class="auth-link auth-link--footer"
      type="button"
      (click)="goToLogin()"
    >
      Ja possui cadastro? Entrar
    </button>

  }

</app-auth-shell>

@if (alert(); as currentAlert) {

  <app-alert-popup
    [type]="currentAlert.type"
    [title]="currentAlert.title"
    [message]="currentAlert.message"
    [actionLabel]="currentAlert.actionLabel"
    (dismissed)="dismissAlert()"
  />

}
