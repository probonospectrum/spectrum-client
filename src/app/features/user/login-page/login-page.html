<app-auth-shell [compact]="isRegisterMode">
  @if (!isRegisterMode) {
    <form class="auth-form auth-form--login" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <app-input
        label="Nome de usuário ou email"
        placeholder="Seu nome de usuário"
        autocomplete="email"
        formControlName="email"
        [error]="fieldError('login', 'email')"
      />

      <app-input
        label="Senha"
        placeholder="Sua senha"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [error]="fieldError('login', 'password')"
      />

      <button class="auth-link" type="button">Esqueceu sua senha? Clique aqui para redefiní-la</button>
      <button class="auth-link" type="button" (click)="goToRegister()">
        Ainda não possui cadastro? Cadastre-se aqui
      </button>

      <app-button type="submit" [disabled]="isSubmitting">Entrar</app-button>
    </form>
  } @else {
    <app-auth-mode-toggle [registerStep]="registerStep" />

    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="submitRegister()">
      @if (registerStep === 1) {
        <app-input
          label="Nome de usuário"
          placeholder="Seu nome de usuário"
          autocomplete="username"
          formControlName="nickname"
          [error]="fieldError('register', 'nickname')"
        />

        <app-input
          label="Email"
          placeholder="Seu email"
          autocomplete="email"
          formControlName="email"
          [error]="fieldError('register', 'email')"
        />

        <app-input
          label="Data de nascimento"
          placeholder="DD/MM/YYYY"
          type="date"
          autocomplete="bday"
          formControlName="birthDate"
          [error]="fieldError('register', 'birthDate')"
        />

        <app-input
          label="Senha"
          placeholder="Sua senha"
          type="password"
          autocomplete="new-password"
          formControlName="password"
          [error]="fieldError('register', 'password')"
        />

        <app-button type="button" (click)="goToNextRegisterStep()">Próximo</app-button>
      } @else {
        <div class="auth-avatar" aria-hidden="true">
          <span></span>
        </div>

        <app-input
          label="Nome próprio"
          placeholder="Seu nome"
          autocomplete="name"
          formControlName="name"
          [error]="fieldError('register', 'name')"
        />

        <app-input
          label="Estado"
          placeholder="Seu estado"
          autocomplete="address-level1"
          formControlName="state"
          [error]="fieldError('register', 'state')"
        />

        <app-input
          label="Município"
          placeholder="Seu município"
          autocomplete="address-level2"
          formControlName="cityId"
          [error]="fieldError('register', 'cityId')"
        />

        <div class="auth-actions">
          <button class="auth-link" type="button" (click)="goToPreviousRegisterStep()">Voltar</button>
          <app-button type="submit" [disabled]="isSubmitting">Cadastrar</app-button>
        </div>
      }
    </form>

    <button class="auth-link auth-link--footer" type="button" (click)="goToLogin()">
      Já possui cadastro? Entrar
    </button>
  }

  @if (feedback) {
    <p class="auth-feedback">{{ feedback }}</p>
  }
</app-auth-shell>
