<app-social-shell
  [user]="user"
  [suggestions]="suggestions"
  title="Configuracoes"
  subtitle="Preferencias e seguranca"
  (logout)="logout()"
>
  <button class="settings-save" type="button" social-actions (click)="save()">Salvar alteracoes</button>

  <div class="settings-grid">
    <app-settings-section
      title="Conta"
      description="Dados basicos usados para identificar sua conta no Spectrum."
    >
      <label>
        E-mail principal
        <input type="email" [value]="user?.email || 'usuario@spectrum.com'" disabled />
      </label>
      <label>
        Idioma
        <select
          [ngModel]="settings.language"
          (ngModelChange)="setSetting('language', $event)"
          name="language"
        >
          <option value="pt-BR">Portugues - Brasil</option>
          <option value="en-US">English</option>
        </select>
      </label>
    </app-settings-section>

    <app-settings-section title="Preferencias" description="Ajustes gerais da experiencia.">
      <app-toggle-switch
        label="Modo compacto"
        [checked]="settings.compactMode"
        (checkedChange)="setSetting('compactMode', $event)"
      />
      <app-toggle-switch
        label="Receber novidades"
        [checked]="settings.news"
        (checkedChange)="setSetting('news', $event)"
      />
    </app-settings-section>

    <app-settings-section title="Notificacoes" description="Escolha quais alertas elu deseja receber.">
      <app-toggle-switch
        label="Notificacoes dentro do app"
        [checked]="settings.inAppNotifications"
        (checkedChange)="setSetting('inAppNotifications', $event)"
      />
      <app-toggle-switch
        label="E-mails"
        [checked]="settings.emailNotifications"
        (checkedChange)="setSetting('emailNotifications', $event)"
      />
      <app-toggle-switch
        label="Atualizacoes importantes"
        [checked]="settings.importantUpdates"
        (checkedChange)="setSetting('importantUpdates', $event)"
      />
      <app-toggle-switch
        label="Alertas de seguranca"
        [checked]="settings.securityAlerts"
        (checkedChange)="setSetting('securityAlerts', $event)"
      />
    </app-settings-section>

    <app-settings-section title="Seguranca" description="Simulacao local de senha e dispositivos.">
      <div class="settings-session">
        <span>Sessoes ativas</span>
        <strong>{{ settings.activeSessions }}</strong>
      </div>
      <div class="settings-session">
        <span>Dispositivo confiavel</span>
        <strong>{{ settings.trustedDevice }}</strong>
      </div>
      <label>
        Senha atual
        <input type="password" [(ngModel)]="currentPassword" name="currentPassword" />
      </label>
      <label>
        Nova senha
        <input type="password" [(ngModel)]="newPassword" name="newPassword" />
      </label>
    </app-settings-section>
  </div>

  @if (showSuccess) {
    <app-alert-popup
      type="success"
      title="Configuracoes salvas"
      message="As preferencias foram atualizadas localmente para demonstracao."
      actionLabel="Ok"
      (dismissed)="showSuccess = false"
    />
  }
</app-social-shell>
