<div class="interests-page" role="dialog" aria-modal="true" aria-labelledby="interests-title">

  <section class="interests" aria-labelledby="interests-title">

    <div class="interests__header">
      <span class="interests__eyebrow">
        PERSONALIZE SUA EXPERIÊNCIA
      </span>

      <h1 id="interests-title">
        Quais são seus interesses?
      </h1>

      <p>
        Selecione os assuntos que você gosta para encontrar comunidades,
        pessoas e publicações que combinam com você.
      </p>
    </div>

    <div class="interests__content">

      <div class="interests-grid">

        <button
          *ngFor="let interest of interests"
          type="button"
          class="interest-card"
          [class.interest-card--selected]="isSelected(interest)"
          (click)="toggleInterest(interest)"
        >

          <span class="interest-card__icon">
            {{ interest.icon }}
          </span>

          <span class="interest-card__content">
            <strong>{{ interest.name }}</strong>
          </span>

          <span
            class="interest-card__check"
            [attr.aria-hidden]="!isSelected(interest)"
          >
            ✓
          </span>

        </button>

      </div>

      <div class="interests-actions">

        <span class="interests-selected">
          {{ selectedInterests.length }} interesses selecionados
        </span>

        <button
          type="button"
          class="interests-action interests-action--primary"
          [disabled]="selectedInterests.length === 0"
          (click)="continue()"
        >
          Continuar
        </button>

      </div>

    </div>

  </section>

</div>
