<div class="saved-posts">
  <header class="saved-posts__header">
    <a routerLink="/perfil" class="saved-posts__back" aria-label="Voltar para o perfil">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </a>
    <h1 class="saved-posts__title">Itens salvos</h1>
  </header>

  <div class="saved-posts__feed">
    @for (post of posts(); track post.id) {
      <app-post-card [post]="post" [showSaveButton]="false"/>
    }

    @if (posts().length === 0) {
      <div class="saved-posts__empty">
        <span class="material-symbols-outlined saved-posts__empty-icon" aria-hidden="true">
          bookmark
        </span>
        <h2>Nenhum item salvo</h2>
        <p>As publicações que você salvar vão aparecer por aqui.</p>
        <a routerLink="/publicacoes" class="saved-posts__empty-action">Ver publicações</a>
      </div>
    }
  </div>
</div>
